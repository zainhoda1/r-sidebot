# Question structure extracted from survey.html
q_familiarity:
  type: mc
  label: Before today, how familiar were you with coffee growing or coffee sourcing?
  options:
    Not at all familiar: none
    Slightly familiar: slight
    Moderately familiar: moderate
    Very familiar: very
practice_size_age:
  type: mc
  label: Across all farms, how are farm size and tree age related?
  options:
    Positively related: positive
    Negatively related: negative
    No relation: no_relation
    Cannot determine from the data: cannot_determine
q1_altitude:
  type: mc
  label: A cooperative is buying land to plant a new coffee plot, and wants the coffee
    to sell for the highest possible price per kilogram. Based on the data, should
    they buy land at a higher or a lower altitude?
  options:
    Higher altitude: higher
    Lower altitude: lower
    Altitude doesn’t affect price per kg: no_effect
    Cannot determine from the data: cannot_determine
q2_size_altitude:
  type: mc
  label: Among farms of the same size, which varietal tends to be grown at a higher
    altitude — Caturra or Typica?
  options:
    Caturra: caturra
    Typica: typica
    Both are grown at the same altitude: same
    Cannot determine from the data: cannot_determine
q3_price:
  type: mc
  label: Which varietal has the highest average price per kilogram?
  options:
    Bourbon: bourbon
    Catuai: catuai
    Caturra: caturra
    Gesha: gesha
    Typica: typica
    All the same: all_same
q4_altitude_varietal:
  type: mc
  label: Which varietal is grown at the highest average altitude?
  options:
    Bourbon: bourbon
    Catuai: catuai
    Caturra: caturra
    Gesha: gesha
    Typica: typica
    All the same: all_same
q5_yield_price:
  type: mc
  label: How are yield per hectare and price per kilogram related?
  options:
    Positively related: positive
    Negatively related: negative
    No relation: no_relation
    Cannot determine from the data: cannot_determine
